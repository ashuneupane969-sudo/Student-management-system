<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Page.css">
    <title>SMS Login</title>
    <link rel="icon" type="image/png" href="logooo.png"> 
</head>
<body>
    <div class="background">
        <div class="tittle">
        <img src="logooo.png">
        <div class="h1">
        <h1>Student</h1><h2>Management</h2><h3>System</h3>
         </div>
        <div class="tittle-line">
            <span></span>
       </div>
       <div class="h3">
        <p>Manage Students. Manage Future.</p>
       </div>
       </div>
       <div class="user">
        <img src="user.svg">
        <input type="text" placeholder="Enter your username">
        </div>
        <div class="pass">
        <img src="passs.svg">
        <input type="password" placeholder="Enter your password">
        </div>
        <div class="submit">
        <input type="checkbox" id="remember">
        <label for="remember">Remember me</label>
        <a href="#">Forget Password?</a>
         <button type="submit">Login <span class="arrow">→</span></button>
        </div>
        <div class="or">
            <span></span>
            <p>or</p>
            <span></span>
        </div>
        <a href="#" class="create-account">
            <img src="usss.svg">
            Create New Account
        </a>
        <div class="trust">
            <span>Secure</span>
            <span>Trusted</span>
            <span>Easy to use</span>
        </div>
        <div class="secure">
            <img src="shield.svg">
        </div>
        <div class="lastline">
            <p>© 2024 Student Management System. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
